name: CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 设计令牌、可访问性、单元与端到端测试（不含视觉回归）
  verify:
    name: 门禁与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖（严格按 lockfile）
        run: npm ci

      - name: 设计令牌一致性 + 硬编码扫描
        run: npm run check:tokens

      - name: 配色对比度（WCAG 2.1）
        run: npm run check:contrast

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 单元测试
        run: npm run test:unit

      - name: 构建
        run: npm run build

      - name: 安装 Playwright（Chromium）
        run: npx playwright install --with-deps chromium

      - name: 端到端 / 可访问性 / 响应式 / 减弱动效
        run: >-
          npx playwright test
          --project=desktop-light --project=mobile-light --project=reduced-motion
          --grep-invert=@visual
        env:
          CI: 'true'

      - name: 依赖漏洞扫描
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            docs/design-system/contrast-report.md
          retention-days: 14
          if-no-files-found: warn

      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # 视觉回归：基线与生成环境同为 macOS，避免跨平台字体渲染差异
  visual:
    name: 视觉回归（macOS 基线）
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 安装 Playwright（Chromium）
        run: npx playwright install chromium

      - name: 视觉回归
        run: >-
          npx playwright test
          --project=desktop-light --project=desktop-dark --project=tablet-light --project=mobile-light
          --grep=@visual
        env:
          CI: 'true'

      - name: 上传视觉报告与差异图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            reports/
            test-results/
          retention-days: 14
          if-no-files-found: warn
